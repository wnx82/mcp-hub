[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-hub"
# Single source of truth: _version.py. Never hard-code the version here.
dynamic = ["version"]
description = "One MCP server that gives your AI assistant the keys to your whole homelab"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "wnx82" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "homelab", "selfhosted", "proxmox", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=1.28,<2",
    "httpx>=0.28,<0.29",
    "PyYAML>=6.0,<7",
    "uvicorn>=0.51,<0.52",
]

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/wnx82/mcp-hub"
Issues = "https://github.com/wnx82/mcp-hub/issues"
Security = "https://github.com/wnx82/mcp-hub/blob/main/SECURITY.md"

[project.scripts]
mcp-hub = "server:main"
mcp-hub-rescue = "rescue.cli:main"

[tool.setuptools]
py-modules = ["server", "config", "_version"]
packages = ["rescue", "tools"]

[tool.setuptools.dynamic]
version = { attr = "_version.__version__" }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # long lines are pervasive in tool docstrings
    "E402",  # server.py deliberately imports some modules mid-file
    "B008",  # FastMCP tool defaults are evaluated at import on purpose
    "B905",  # zip(strict=) would change behaviour in existing call sites
]
# "UP" is deliberately not enabled yet: it wants ~70 Optional[X] -> X | None
# rewrites across the monolith. Worth doing, but as its own reviewable PR
# rather than silently alongside unrelated changes.
#
# `ruff format` is likewise not enforced yet: reformatting server.py wholesale
# would bury every future diff. Same reasoning - its own PR, or never.

[tool.ruff.lint.isort]
known-first-party = ["config", "rescue", "server", "tools"]
