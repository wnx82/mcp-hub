name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel in a clean virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/package-venv"
          "$RUNNER_TEMP/package-venv/bin/pip" install dist/*.whl
      - name: Smoke test installed commands and imports
        env:
          MCP_HUB_HOME: ${{ runner.temp }}/mcp-hub-package-smoke
          MCP_READ_ONLY: "true"
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/package-venv/bin/mcp-hub" --version
          "$RUNNER_TEMP/package-venv/bin/mcp-hub-rescue" --help
          "$RUNNER_TEMP/package-venv/bin/python" -I - <<'PY'
          import _version
          import config
          import rescue
          import server

          assert _version.__version__
          assert server.mcp
          print("installed package imports successfully")
          PY

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate staged systemd installation
        run: bash scripts/test_install.sh

  rescue:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Rescue works without hub dependencies
        run: python -m unittest discover -s tests -v
      - name: Rescue CLI imports with a broken main server
        run: |
          printf 'raise RuntimeError("broken hub")\n' > server.py
          python -m rescue.cli --hub-home "$PWD" status || test $? -eq 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --output-format=github .
      - name: Version and CHANGELOG agree
        run: python scripts/check_version.py
      - name: Generated artifacts are not tracked
        run: python scripts/check_repo_hygiene.py

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Critical helper tests
        env:
          MCP_HUB_HOME: ${{ github.workspace }}
          MCP_READ_ONLY: "true"
        run: python -m unittest tests.test_core -v
      - name: Import and register every tool
        env:
          MCP_HUB_HOME: ${{ github.workspace }}
          MCP_READ_ONLY: "true"
        run: |
          cp hosts.example.yaml hosts.yaml
          python - <<'PY'
          import asyncio, server, config
          tools = asyncio.run(server.mcp.list_tools())
          names = {t.name for t in tools}
          assert tools, "no tools registered"
          missing = config.MUTATING_TOOLS - names
          assert not missing, f"MUTATING_TOOLS names no real tool: {sorted(missing)}"
          print(f"{len(tools)} tools registered, {len(config.MUTATING_TOOLS)} guarded")
          PY
      - name: Read-only mode must refuse a mutating tool
        env:
          MCP_HUB_HOME: ${{ github.workspace }}
          MCP_READ_ONLY: "true"
        run: |
          python - <<'PY'
          import asyncio, server
          r = asyncio.run(server.mcp.call_tool('local_exec', {'command': 'echo nope'}))
          assert 'read-only' in str(r), r
          print("read-only guard holds")
          PY
      - name: Tool registration and README agree
        env:
          MCP_HUB_HOME: ${{ github.workspace }}
          MCP_READ_ONLY: "true"
        run: python scripts/check_tool_docs.py
      - name: Tool descriptions are in English
        env:
          MCP_HUB_HOME: ${{ github.workspace }}
          MCP_READ_ONLY: "true"
        run: python scripts/check_tool_docstrings.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject private network data
        run: |
          # Documentation ranges (192.0.2.x, 198.51.100.x, 203.0.113.x) and
          # loopback are fine; anything else that looks like a real host is not.
          if grep -rInE '\b(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)[0-9]+\.[0-9]+' \
               --include='*.py' --include='*.yaml' --include='*.md' --include='*.sh' . ; then
            echo "::error::private IP address committed"; exit 1
          fi
          if git ls-files | grep -E '^(hosts|topology|endpoints)\.yaml$|^\.env$'; then
            echo "::error::a real config file is tracked"; exit 1
          fi
